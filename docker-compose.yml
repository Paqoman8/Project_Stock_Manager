services:

  # ─── Base de données ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stockmanager-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gstock_db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gstock_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Backend Express ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockmanager-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/gstock_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-changez-moi-en-production-avec-openssl-rand-hex-32}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5001
      FRONTEND_URL: http://localhost:3005
    ports:
      - "5001:5001"
      - "5555:5555"  # Prisma Studio
    restart: unless-stopped

  # ─── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passé au moment de "next build" pour être sérialisé dans le routes-manifest
        BACKEND_URL: http://backend:5001
        # Nom affiché dans l'UI — configurable via APP_NAME dans le .env racine
        APP_NAME: ${APP_NAME:-Stock Manager}
    container_name: stockmanager-frontend
    depends_on:
      - backend
    ports:
      - "3005:3000"
    restart: unless-stopped

volumes:
  postgres-data:
