services:

  # ─── Base de données ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stockmanager-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gstock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gstock_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─── Backend Express ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockmanager-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/gstock_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-changez-moi-en-production-avec-openssl-rand-hex-32}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5001:5001"
    restart: unless-stopped

  # ─── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockmanager-frontend
    depends_on:
      - backend
    environment:
      # En Docker, le frontend (serveur Next.js) parle au backend via le réseau interne
      BACKEND_URL: http://backend:5001
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
